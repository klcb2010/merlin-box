name: Sync Upstream Release

on:
  push:
    branches:
      - main
    paths:
      - "mod/**"
      - ".github/workflows/sync-upstream-release.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "即使上游没有新 Release，也构建当前分支"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream stable Release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL https://api.github.com/repos/LandDuck/merlin-box/releases/latest)"
          tag="$(jq -r '.tag_name // empty' <<< "$release_json")"
          draft="$(jq -r '.draft' <<< "$release_json")"
          prerelease="$(jq -r '.prerelease' <<< "$release_json")"
          test -n "$tag"
          test "$draft" = "false"
          test "$prerelease" = "false"
          current="$(tr -d '\r\n' < mod/upstream-release.txt 2>/dev/null || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" != "$current" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync only after a new upstream Release
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.upstream.outputs.tag }}'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL "https://github.com/LandDuck/merlin-box/archive/refs/tags/$tag.tar.gz" -o "$work/upstream.tar.gz"
          mkdir "$work/upstream"
          tar -xzf "$work/upstream.tar.gz" -C "$work/upstream" --strip-components=1
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='README.zh-CN.md' \
            --exclude='mod/' \
            --exclude='dist/' \
            "$work/upstream/" ./
          printf '%s\n' "$tag" > mod/upstream-release.txt

      - name: Commit upstream source snapshot
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): import upstream release ${{ steps.upstream.outputs.tag }}"
            git push
          fi

      - name: Prepare isolated build workspace
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/merlin-box-build"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            ./ "$RUNNER_TEMP/merlin-box-build/"

      - name: Apply mod injections
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        working-directory: ${{ runner.temp }}/merlin-box-build
        run: |
          set -euo pipefail
          python3 mod/apply.py
          python3 mod/apply.py

      - name: Set up Go
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        uses: actions/setup-go@v5
        with:
          go-version-file: ui/server/go.mod
          cache-dependency-path: ui/server/go.sum

      - name: Set up Node.js
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend build tools
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22 gulp-cli
          npm_global_bin="$(npm prefix --global)/bin"
          echo "$npm_global_bin" >> "$GITHUB_PATH"
          export PATH="$npm_global_bin:$PATH"
          command -v node
          command -v yarn
          command -v gulp
          node --version
          yarn --version
          gulp --version

      - name: Install frontend dependencies early
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        working-directory: ${{ runner.temp }}/merlin-box-build/ui/front
        run: |
          set -euo pipefail
          yarn install

      - name: Set up Python
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python test dependencies
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        working-directory: ${{ runner.temp }}/merlin-box-build
        run: |
          python3 -m pip install -r tools/sub2box/requirements.txt pytest

      - name: Test mod injections
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        working-directory: ${{ runner.temp }}/merlin-box-build
        run: |
          set -euo pipefail
          python3 -m py_compile tools/sub2box/main.py mod/apply.py
          python3 -m pytest -q mod/tests
          cd ui/server
          go test ./...

      - name: Build ARM64 router package
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        working-directory: ${{ runner.temp }}/merlin-box-build
        timeout-minutes: 90
        run: |
          set -euo pipefail
          chmod +x ./merlin-box.sh
          ./merlin-box.sh tool package arm64

      - name: Build ARM router package
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        working-directory: ${{ runner.temp }}/merlin-box-build
        timeout-minutes: 90
        run: |
          set -euo pipefail
          ./merlin-box.sh tool package arm

      - name: Archive patched source
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/merlin-box-mod-source.tar.gz" \
            --exclude='.git' --exclude='node_modules' --exclude='dist' \
            -C "$RUNNER_TEMP" merlin-box-build

      - name: Publish fork release
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}.1
          name: ${{ steps.upstream.outputs.tag }}.1 (klcb mod)
          target_commitish: main
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/merlin-box-build/dist/*.tar.gz
            ${{ runner.temp }}/merlin-box-mod-source.tar.gz
